<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Математикалық амалдар</title>
</head>
<body>
	<h2>Математикалық амалдар мысалдары</h2>
	<hr>
	<h3>1. Қосу (+)</h3>
	<p>5 + 3 = 8</p>

	<h3>2. Азайту (-)</h3>
	<p>10 - 4 = 6</p>

	<h3>3. Көбейту (*)</h3>
	<p>4 * 5 = 20</p>
	<p><i>Немесе нүкте арқылы:</i> 4 * 5 = 20</p>

	<h3>4. Бөлу (/)</h3>
	<p>20 / 4 = 5</p>
	<p><i>Немесе бөлшек түрінде:</i>
		<sup>20</sup> <sub>4</sub> = 5
	</p>
</body>
</html>
